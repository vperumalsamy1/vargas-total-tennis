<!-- ============================================================
     SNIPPET 1: ANNOUNCEMENT BAR
     Where to add: Pages → Home → Add Block → Code (at the very
     top of the page, above all other sections).
     What it does: Sticky green banner with a dismiss button.
     ============================================================ -->

<style>
  #vtt-announcement {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background-color: #1D9E75;
    color: #ffffff;
    font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    padding: 10px 48px 10px 16px;
    line-height: 1.4;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  #vtt-announcement a {
    color: #ffffff;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  #vtt-announcement a:hover {
    opacity: 0.85;
  }

  #vtt-announcement-close {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #ffffff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    opacity: 0.8;
    transition: opacity 0.15s ease;
  }

  #vtt-announcement-close:hover {
    opacity: 1;
  }

  #vtt-announcement.dismissed {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }

  /* Push page content down so bar doesn't overlap */
  body.vtt-bar-visible {
    padding-top: 40px;
  }
</style>

<div id="vtt-announcement" role="banner" aria-label="Announcement">
  🎾 Now enrolling for Summer 2026 &nbsp;·&nbsp;
  <a href="#contact">Book a free trial lesson →</a>
  <button id="vtt-announcement-close" aria-label="Dismiss announcement">×</button>
</div>

<script>
  (function () {
    var bar = document.getElementById('vtt-announcement');
    var closeBtn = document.getElementById('vtt-announcement-close');

    if (!bar) return;

    // Don't show bar if dismissed this session
    if (sessionStorage.getItem('vtt-bar-dismissed')) {
      bar.style.display = 'none';
      return;
    }

    document.body.classList.add('vtt-bar-visible');

    closeBtn.addEventListener('click', function () {
      bar.classList.add('dismissed');
      document.body.classList.remove('vtt-bar-visible');
      sessionStorage.setItem('vtt-bar-dismissed', '1');
    });

    // Also add nav scroll class used by Custom CSS (section 6)
    window.addEventListener('scroll', function () {
      if (window.scrollY > 60) {
        document.body.classList.add('nav-scrolled');
      } else {
        document.body.classList.remove('nav-scrolled');
      }
    });
  })();
</script>

<!-- END SNIPPET 1 -->




<!-- ============================================================
     SNIPPET 2: ANIMATED STATS ROW
     Where to add: Hero section or a standalone section below
     the hero. Add as a Code Block inside a full-width section
     with a dark green background (#085041).
     What it does: Four numbers count up when scrolled into view.
     ============================================================ -->

<style>
  #vtt-stats {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 12px;
    flex-wrap: wrap;
    padding: 40px 24px;
    max-width: 780px;
    margin: 0 auto;
  }

  .vtt-stat {
    flex: 1 1 140px;
    text-align: center;
    padding: 24px 16px;
    border: 0.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    min-width: 130px;
  }

  .vtt-stat-number {
    display: block;
    font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: 36px;
    font-weight: 500;
    color: #ffffff;
    letter-spacing: -0.02em;
    line-height: 1;
    transition: none;
  }

  .vtt-stat-label {
    display: block;
    font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 8px;
  }
</style>

<div id="vtt-stats" aria-label="Coaching stats">
  <div class="vtt-stat">
    <span class="vtt-stat-number" data-target="10" data-suffix="+">0</span>
    <span class="vtt-stat-label">Years Coaching</span>
  </div>
  <div class="vtt-stat">
    <span class="vtt-stat-number" data-target="5.0" data-suffix="★" data-decimal="1">0</span>
    <span class="vtt-stat-label">Average Rating</span>
  </div>
  <div class="vtt-stat">
    <span class="vtt-stat-number" data-target="100" data-suffix="+">0</span>
    <span class="vtt-stat-label">Students Coached</span>
  </div>
  <div class="vtt-stat">
    <span class="vtt-stat-number" data-target="5" data-suffix="yrs+">0</span>
    <span class="vtt-stat-label">Junior Programs</span>
  </div>
</div>

<script>
  (function () {
    function animateStat(el) {
      var target = parseFloat(el.getAttribute('data-target'));
      var suffix = el.getAttribute('data-suffix') || '';
      var isDecimal = el.hasAttribute('data-decimal');
      var decimals = parseInt(el.getAttribute('data-decimal') || '0', 10);
      var duration = 1400;
      var start = null;

      function step(timestamp) {
        if (!start) start = timestamp;
        var progress = Math.min((timestamp - start) / duration, 1);
        // Ease out cubic
        var eased = 1 - Math.pow(1 - progress, 3);
        var current = eased * target;
        el.textContent = current.toFixed(decimals) + suffix;
        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }

      requestAnimationFrame(step);
    }

    var statsSection = document.getElementById('vtt-stats');
    if (!statsSection) return;

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          var numbers = entry.target.querySelectorAll('.vtt-stat-number');
          numbers.forEach(animateStat);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });

    observer.observe(statsSection);
  })();
</script>

<!-- END SNIPPET 2 -->
